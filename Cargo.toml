[workspace]
members = ["visqol-rs", "visqol"]
resolver = "2"

[profile.release]
opt-level = 3
strip = "symbols"
debug = false
lto = "fat"

[profile.bench]
debug = "full"
strip = "none"
lto = "fat"

# Release build with debug info for profiling with heaptrack:
# cargo build --profile heaptrack -p visqol
# heaptrack target/heaptrack/visqol <args>
[profile.heaptrack]
inherits = "release"
strip = "none"
debug = true
